<p>可话花园是一款免费的纯前端可话动态查看器，用来重新浏览可话导出包里的文字、图片与视频。</p>
      <h2>本地处理，保护回忆隐私</h2>
      <p>你可以导入解压后的可话文件夹或 ZIP 压缩包。解析、整理和展示均在浏览器本地完成，数据不会上传到服务器。</p>
      <h2>主要功能</h2>
      <ul>
        <li>按时间线浏览过去的可话动态</li>
        <li>集中查看导出包中的图片与视频</li>
        <li>支持文件夹和 ZIP 两种导入方式</li>
        <li>无需注册，也不依赖后端服务</li>
      </ul>
      <p><a href="/guide/">阅读使用指南</a> · <a href="/about/">了解项目</a> · <a href="/privacy/">查看隐私说明</a></p>
